<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST HASH+VOICE - Debug Checklist (Fixed)</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 呼吸紅燈效果 (HASH 驗證成功時) */
        @keyframes breathingRed {
            0% { background-color: rgba(255, 0, 0, 0.15); }
            50% { background-color: rgba(255, 0, 0, 0.9); }
            100% { background-color: rgba(255, 0, 0, 0.15); }
        }
        .breathing-red {
            animation: breathingRed 1.5s infinite ease-in-out;
        }

        /* 蒂芬妮綠護盾樣式 */
        #shield-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-sizing: border-box; border: 30px solid #81D8D0;
            box-shadow: inset 0 0 70px #81D8D0, 0 0 50px #81D8D0;
            pointer-events: none; opacity: 0;
            transition: opacity 0.4s ease-in-out; z-index: 5;
        }
        .shield-active { opacity: 1 !important; }

        /* Canvas 圖騰繪製層 */
        #stageCanvas {
            position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none;
        }

        /* Webcam 視訊預覽 (右下角) */
        .video-container {
            position: absolute; width: 240px; height: 180px;
            bottom: 20px; right: 20px; border-radius: 12px; z-index: 20;
            box-shadow: 0 0 20px rgba(129, 216, 208, 0.6); overflow: hidden;
            border: 2px solid #333;
        }
        #video-preview {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
        }
        #analysis-overlay {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0,0,0,0.75); padding: 4px 8px; border-radius: 4px;
            font-size: 11px; font-family: monospace; pointer-events: none;
        }

        /* UI 與除錯 Checklist 面板 (左上角) */
        #ui-info {
            position: absolute; top: 20px; left: 20px; color: #fff; z-index: 20;
            background: rgba(0, 0, 0, 0.75); padding: 20px 25px; border-radius: 12px;
            backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.15);
            min-width: 320px;
        }
        #ui-info h1 { margin: 0 0 10px 0; font-size: 22px; color: #81D8D0; }

        /* 除錯 Checklist 樣式 */
        .debug-panel {
            margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 12px;
        }
        .debug-title {
            font-size: 13px; color: #aaa; margin-bottom: 8px; font-weight: bold;
            letter-spacing: 1px;
        }
        .checklist-item {
            font-size: 14px; margin: 8px 0; color: #777;
            display: flex; align-items: center; transition: color 0.3s;
        }
        .checklist-item .icon {
            display: inline-block; width: 20px; font-size: 16px; margin-right: 8px;
            text-align: center;
        }
        /* 打勾與啟用狀態 */
        .checklist-item.checked {
            color: #81D8D0; font-weight: bold;
            text-shadow: 0 0 8px rgba(129, 216, 208, 0.4);
        }

        .log-box {
            font-size: 12px; color: #aaa; margin-top: 12px; font-family: monospace;
            background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px;
        }
        #cv-status {
            position: absolute; bottom: 10px; left: 10px; color: #777; font-size: 12px; z-index: 10;
        }

        .btn-sim {
            margin-top: 10px; padding: 6px 10px; background: #333; color: #81D8D0;
            border: 1px solid #81D8D0; border-radius: 4px; cursor: pointer; font-size: 11px;
            display: block; width: 100%; box-sizing: border-box;
        }
        .btn-sim:hover { background: #81D8D0; color: #111; }

        /* HASH 比對監聽中的按鈕樣式 */
        .btn-sim.active {
            background: #ff3333; color: #fff; border-color: #ff3333;
            animation: pulseBtn 1s infinite ease-in-out;
        }
        @keyframes pulseBtn {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        #hash-status {
            font-size: 11px; color: #81D8D0; margin-top: 6px; font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="shield-layer"></div>
    <canvas id="stageCanvas"></canvas>

    <div class="video-container">
        <video id="video-preview" autoplay playsinline muted></video>
        <div id="analysis-overlay">Optical: IDLE</div>
    </div>

    <!-- 主面板與除錯 Checklist -->
    <div id="ui-info">
        <h1>TEST HASH+VOICE</h1>
        <div id="version-tag" style="font-size:11px; color:#888; margin:-6px 0 8px 0; font-family:monospace;">
            v10 · 加權紅色重心定位+嚴謹2Hz判定 · 2026-08-14
        </div>
        <p style="margin: 0; font-size: 13px; color: #ccc;">系統狀態監視面板</p>

        <div class="debug-panel">
            <div class="debug-title">🔍 除錯即時狀態條 (DEBUG CHECKLIST)</div>

            <div id="chk-optical" class="checklist-item">
                <span class="icon">⬜</span> 1. 光學喚醒 (偵測到 2Hz 閃爍)
            </div>

            <div id="chk-hash" class="checklist-item">
                <span class="icon">⬜</span> 2. HASH 碼比對成功
            </div>

            <div id="chk-mic-on" class="checklist-item">
                <span class="icon">⬜</span> 3. 麥克風開啟
            </div>

            <!-- 進入網頁時預設即是打勾狀態 -->
            <div id="chk-mic-off" class="checklist-item checked">
                <span class="icon">✅</span> 4. 麥克風關閉
            </div>
        </div>

        <div class="log-box">
            最後辨識語音: <span id="speech-log" style="color: #fff;">(無)</span>
        </div>

        <!-- 模擬測試按鈕 (方便離線除錯) -->
        <button class="btn-sim" onclick="simulateHashDetect()">[測試] 模擬接收 HASH 光訊號</button>

        <!-- 真正的 HASH 光學偵測比對開關 -->
        <button id="hash-btn" class="btn-sim" onclick="toggleHashDetection()">🔓 啟動 HASH 比對</button>
        <div id="hash-status">狀態：待機</div>
    </div>

    <div id="cv-status">OpenCV.js loading...</div>

    <!-- 載入 OpenCV.js -->
    <script async src="https://docs.opencv.org/4.5.4/opencv.js" onload="onOpenCvReady();"></script>

    <script>
        // =========================================================================
        // A. 除錯顯示 UI 控制 logic
        // =========================================================================
        const chkOptical = document.getElementById('chk-optical');
        const chkHash    = document.getElementById('chk-hash');
        const chkMicOn   = document.getElementById('chk-mic-on');
        const chkMicOff  = document.getElementById('chk-mic-off');

        function setCheckStatus(element, isChecked) {
            const icon = element.querySelector('.icon');
            if (isChecked) {
                element.classList.add('checked');
                icon.innerText = '✅';
            } else {
                element.classList.remove('checked');
                icon.innerText = '⬜';
            }
        }

        // =========================================================================
        // B. 基礎介面
        // =========================================================================
        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('stageCanvas');
        const ctx = canvas.getContext('2d');
        const shield = document.getElementById('shield-layer');
        const speechLog = document.getElementById('speech-log');
        const cvStatusTxt = document.getElementById('cv-status');
        const analysisOverlay = document.getElementById('analysis-overlay');
        const hashBtn = document.getElementById('hash-btn');
        const hashStatusEl = document.getElementById('hash-status');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // [修正] OpenCV 就緒與 Video 就緒是兩條獨立的非同步流程，
        // 必須「兩者都完成」才能安全啟動分析，否則 Mat 尺寸會是 0x0。
        let isOpenCvReady = false;
        let isVideoReady = false;

        function onOpenCvReady() {
            cvStatusTxt.innerText = "OpenCV.js Ready.";
            cvStatusTxt.style.color = "#81D8D0";
            isOpenCvReady = true;
            tryStartAnalysis();
        }

        function tryStartAnalysis() {
            if (isOpenCvReady && isVideoReady && !videoCapture) {
                startOpticalAnalysis();
            }
        }

        // =========================================================================
        // C. 光學喚醒 (2Hz) 與 HASH 光通訊解調
        // =========================================================================
        // [修正] 參考較穩定的實作版本，改用「加權紅色重心」定位 LED，取代單純找最亮點。
        // 原本用 cv.minMaxLoc 找「最亮的紅色數值」，遇到房間裡的白光/其他亮光源會誤判——
        // 白光的 R 值通常也很高，minMaxLoc 只看亮度、不看「是不是真的紅色」。
        // 改成計算每個像素的「紅色優勢度」(redExcess = R - 綠藍分量*1.35)，
        // 只有明顯偏紅的像素才列入計算，並用 redExcess² 加權平均出中心點——
        // 對遠距離、只剩幾個像素大小的 LED 更穩定，也更不會被白光騙走定位。
        const ANALYSIS_FPS = 60;
        let videoCapture = null;
        let srcMat = null, grayMat = null;

        const OPTICAL_CONFIG = {
            // 紅色 LED 定位
            MIN_RED: 70,            // 像素R值至少要多少才考慮
            RED_DOMINANCE: 1.35,    // R 必須超過 G/B 的這個倍數，才算「真的偏紅」
            ROI_MIN_SIZE: 12,
            ROI_SIZE: 42,           // 追蹤到中心點後，取樣的正方形區域邊長（像素）

            // 2Hz 光學喚醒判定（嚴格版：需確認真正的週期性閃爍，不是單純看到紅色）
            MIN_AMPLITUDE: 18,
            REQUIRED_FULL_CYCLES: 2,     // 至少要看到 2 個完整 ON/OFF 週期才算數
            MIN_HALF_PERIOD_MS: 150,
            MAX_HALF_PERIOD_MS: 350,     // 2Hz 半週期約250ms，抓合理範圍
            MIN_FULL_PERIOD_MS: 400,
            MAX_FULL_PERIOD_MS: 600,     // 2Hz 全週期約500ms
            MIN_STATE_DWELL_MS: 100,     // 高/低狀態至少要停留這麼久才算穩定，濾掉單張雜訊

            HISTORY_MS: 2200,
            DEBUG_INTERVAL_MS: 250
        };

        const opticalHistory = [];
        let ledRoi = null;
        let lastLedCenter = null;
        let lastOpticalDebugTime = 0;
        let opticalTriggerLatchedUntil = 0;

        navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 640 },
                height: { ideal: 480 },
                frameRate: { ideal: ANALYSIS_FPS, min: 30 }
            }
        })
            .then(stream => {
                video.srcObject = stream;
                // [修正] 等 metadata 載入後才拿得到真正的 videoWidth/videoHeight，
                // 並把它們寫回 video.width / video.height（IDL 屬性），
                // 這樣 cv.VideoCapture 和 cv.Mat 才會用正確的尺寸建立。
                video.onloadedmetadata = () => {
                    video.width = video.videoWidth || 320;
                    video.height = video.videoHeight || 240;
                    isVideoReady = true;
                    tryStartAnalysis();
                };
            })
            .catch(err => {
                console.error("Webcam存取失敗:", err);
                cvStatusTxt.innerText = "攝影機存取失敗（請確認權限 / HTTPS）";
                cvStatusTxt.style.color = "#f55";
            });

        function startOpticalAnalysis() {
            videoCapture = new cv.VideoCapture(video);
            srcMat = new cv.Mat(video.height, video.width, cv.CV_8UC4);
            grayMat = new cv.Mat(video.height, video.width, cv.CV_8UC1);

            setInterval(processVideoFrame, 1000 / ANALYSIS_FPS);
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        // 全畫面掃描（每2像素取樣一次以加快速度），找出「加權紅色重心」。
        // 用平方加權讓訊號強的像素主導結果，對小亮點更穩定。
        function findRedLedCenter() {
            const width = srcMat.cols;
            const height = srcMat.rows;
            const data = srcMat.data;
            const step = 2;
            let weightSum = 0, xSum = 0, ySum = 0, strongest = 0;

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const idx = (y * width + x) * 4;
                    const r = data[idx], g = data[idx + 1], b = data[idx + 2];

                    const redExcess = r - Math.max(g * OPTICAL_CONFIG.RED_DOMINANCE, b * OPTICAL_CONFIG.RED_DOMINANCE);
                    if (r >= OPTICAL_CONFIG.MIN_RED && redExcess > 8) {
                        const weight = redExcess * redExcess;
                        weightSum += weight;
                        xSum += x * weight;
                        ySum += y * weight;
                        if (redExcess > strongest) strongest = redExcess;
                    }
                }
            }

            if (weightSum < 1 || strongest < 10) return null; // 這一幀沒找到夠格的紅色訊號
            return { x: xSum / weightSum, y: ySum / weightSum };
        }

        // LED 亮起時才更新追蹤座標；LED 熄滅(bit=0)的瞬間 findRedLedCenter 會回傳 null，
        // 這裡就直接沿用上一個已知位置，不會被雜訊拉走。
        function updateLedRoi(center) {
            if (!center) return;
            const width = srcMat.cols, height = srcMat.rows;
            const size = Math.max(OPTICAL_CONFIG.ROI_MIN_SIZE, OPTICAL_CONFIG.ROI_SIZE);

            const x = Math.round(center.x - size / 2);
            const y = Math.round(center.y - size / 2);
            const w = Math.min(size, width);
            const h = Math.min(size, height);

            ledRoi = {
                x: clamp(x, 0, Math.max(0, width - w)),
                y: clamp(y, 0, Math.max(0, height - h)),
                w, h
            };
            lastLedCenter = center;
        }

        // 只在鎖定的小範圍內取 R/G/B 平均值（而非整張畫面），訊號不會被背景稀釋
        function sampleRedRoi() {
            if (!ledRoi) return null;
            const data = srcMat.data;
            const width = srcMat.cols;
            const { x, y, w, h } = ledRoi;
            let sumR = 0, sumG = 0, sumB = 0, count = 0;

            for (let yy = y; yy < y + h; yy += 2) {
                for (let xx = x; xx < x + w; xx += 2) {
                    const idx = (yy * width + xx) * 4;
                    sumR += data[idx]; sumG += data[idx + 1]; sumB += data[idx + 2];
                    count++;
                }
            }
            if (!count) return null;
            return { r: sumR / count, g: sumG / count, b: sumB / count };
        }

        function pushOpticalSample(value, now) {
            opticalHistory.push({ t: now, v: value });
            while (opticalHistory.length && now - opticalHistory[0].t > OPTICAL_CONFIG.HISTORY_MS) {
                opticalHistory.shift();
            }
        }

        function processVideoFrame() {
            if (!isOpenCvReady || !isVideoReady || video.paused || video.ended) return;

            // [修正] 加上 try/catch，避免單一 frame 讀取失敗時
            // setInterval 每次都拋錯洗版 console、甚至中斷偵測。
            try {
                videoCapture.read(srcMat);
                cv.cvtColor(srcMat, grayMat, cv.COLOR_RGBA2GRAY);

                const now = Date.now();

                // 定位 LED（亮起時重新定位，熄滅時沿用上一個位置），只取局部區域訊號
                const redCenter = findRedLedCenter();
                if (redCenter) updateLedRoi(redCenter);

                const roiSample = sampleRedRoi();
                if (roiSample) {
                    // 紅色優勢訊號：R 減掉半份 G+B。真的是紅光時數值會明顯偏高，
                    // 就算是很亮的白光，這個值也會接近 0，不會被誤判成訊號。
                    const redSignal = roiSample.r - 0.5 * (roiSample.g + roiSample.b);
                    pushOpticalSample(redSignal, now);
                    handleHashSample(redSignal, now);
                }

                // 1. 檢測 2Hz 閃爍 (光學喚醒)：需嚴格確認至少2個完整週期，不是看到紅色就算
                if (detect2HzFlicker()) {
                    if (now >= opticalTriggerLatchedUntil) {
                        opticalTriggerLatchedUntil = now + 2000; // 短暫鎖定，避免同一段閃爍重複觸發
                        handleOpticalTrigger();
                    }
                } else if (!isVoicListenerActive && now >= opticalTriggerLatchedUntil) {
                    setCheckStatus(chkOptical, false);
                }
            } catch (e) {
                console.error("Frame 分析失敗:", e);
            }
        }

        // =========================================================
        // 嚴格 2Hz 光學喚醒判定
        // 「看到紅色」不等於「光學喚醒」，必須同時滿足：
        //   1. 訊號有明顯高低差(amplitude)
        //   2. 確實在 HIGH/LOW 之間交替切換(用 hysteresis 濾掉臨界值抖動)
        //   3. 每個半週期落在 150~350ms 範圍（2Hz 理論值約250ms）
        //   4. 完整週期落在 400~600ms 範圍（2Hz 理論值約500ms）
        //   5. 至少完成 2 個完整 ON/OFF 週期
        // 因此「固定亮紅燈」或單純的雜訊閃爍都不會誤觸發。
        // =========================================================
        function detect2HzFlicker() {
            if (opticalHistory.length < 60) return false;

            const values = opticalHistory.map(s => s.v);
            const sorted = [...values].sort((a, b) => a - b);
            // 用15%/85%百分位數估計LOW/HIGH，避免單一雜訊尖峰拉歪門檻
            const low = sorted[Math.floor(sorted.length * 0.15)];
            const high = sorted[Math.floor(sorted.length * 0.85)];
            const amplitude = high - low;

            if (amplitude < OPTICAL_CONFIG.MIN_AMPLITUDE) {
                updateOpticalDebug(false, amplitude, 0, "LOW AMP");
                return false;
            }

            const hysteresis = Math.max(4, amplitude * 0.15);
            const highThreshold = low + amplitude * 0.65;
            const lowThreshold = low + amplitude * 0.35;

            let state = null, stateStartTime = null;
            const transitions = [];

            for (let i = 0; i < opticalHistory.length; i++) {
                const sample = opticalHistory[i];
                if (state === null) {
                    if (sample.v >= highThreshold + hysteresis) { state = 1; stateStartTime = sample.t; }
                    else if (sample.v <= lowThreshold - hysteresis) { state = 0; stateStartTime = sample.t; }
                    continue;
                }
                if (state === 1 && sample.v <= lowThreshold) {
                    const duration = sample.t - stateStartTime;
                    if (duration >= OPTICAL_CONFIG.MIN_STATE_DWELL_MS) {
                        transitions.push({ from: 1, to: 0, t: sample.t, duration });
                        state = 0; stateStartTime = sample.t;
                    }
                } else if (state === 0 && sample.v >= highThreshold) {
                    const duration = sample.t - stateStartTime;
                    if (duration >= OPTICAL_CONFIG.MIN_STATE_DWELL_MS) {
                        transitions.push({ from: 0, to: 1, t: sample.t, duration });
                        state = 1; stateStartTime = sample.t;
                    }
                }
            }

            if (transitions.length < 4) {
                updateOpticalDebug(false, amplitude, transitions.length, "WAIT 2 CYCLES");
                return false;
            }

            // 確認 crossing 真的是交替(0->1->0->1)，不是同方向重複
            const alternating = [];
            for (let i = 1; i < transitions.length; i++) {
                if (transitions[i].from === transitions[i - 1].to && transitions[i].to !== transitions[i - 1].to) {
                    alternating.push(transitions[i]);
                }
            }
            if (alternating.length < 4) {
                updateOpticalDebug(false, amplitude, alternating.length, "NOT ALTERNATING");
                return false;
            }

            const edges = transitions.slice(-5);
            if (edges.length < 4) return false;

            let validHalfPeriods = 0;
            for (let i = 1; i < edges.length; i++) {
                const dt = edges[i].t - edges[i - 1].t;
                if (dt >= OPTICAL_CONFIG.MIN_HALF_PERIOD_MS && dt <= OPTICAL_CONFIG.MAX_HALF_PERIOD_MS) validHalfPeriods++;
            }
            if (validHalfPeriods < 4) {
                updateOpticalDebug(false, amplitude, validHalfPeriods, "BAD HALF PERIOD");
                return false;
            }

            let validFullPeriods = 0;
            for (let i = 2; i < edges.length; i++) {
                const dt = edges[i].t - edges[i - 2].t;
                if (dt >= OPTICAL_CONFIG.MIN_FULL_PERIOD_MS && dt <= OPTICAL_CONFIG.MAX_FULL_PERIOD_MS) validFullPeriods++;
            }

            const detected = validFullPeriods >= OPTICAL_CONFIG.REQUIRED_FULL_CYCLES &&
                              validHalfPeriods >= 4 && amplitude >= OPTICAL_CONFIG.MIN_AMPLITUDE;

            updateOpticalDebug(detected, amplitude, validFullPeriods, detected ? "2Hz CONFIRMED" : "VERIFY");
            return detected;
        }

        function updateOpticalDebug(detected, amplitude, cycles, reason) {
            const now = Date.now();
            if (now - lastOpticalDebugTime < OPTICAL_CONFIG.DEBUG_INTERVAL_MS) return;
            lastOpticalDebugTime = now;

            const latest = opticalHistory.length ? opticalHistory[opticalHistory.length - 1].v : 0;
            analysisOverlay.innerText = `Optical: ${detected ? "2Hz CONFIRMED" : "SCAN"} | R=${latest.toFixed(0)} A=${amplitude.toFixed(0)} C=${cycles} ${reason}`;
            analysisOverlay.style.color = detected ? "#ff0" : "#fff";
        }

        // 當光學喚醒成功 (偵測到 2Hz 閃爍)
        function handleOpticalTrigger() {
            // 項目 1 打勾：光學喚醒 2Hz
            setCheckStatus(chkOptical, true);

            // 光學觸發後，啟用麥克風監聽
            enableVoiceListener();
        }

        // =========================================================================
        // D. HASH 比對與呼吸燈觸發
        // =========================================================================
        function triggerRedBreathing() {
            // 項目 2 打勾：比對 HASH
            setCheckStatus(chkHash, true);

            document.body.classList.add('breathing-red');

            setTimeout(() => {
                document.body.classList.remove('breathing-red');
                setCheckStatus(chkHash, false); // 復原後取消打勾
            }, 5000);
        }

        function simulateHashDetect() {
            triggerRedBreathing();
        }

        // =========================================================================
        // D-2. HASH 光學解調協定 (OOK / On-Off Keying)
        //
        // 已對照 firmware_double_longpress_hash.ino 實際規格調整：
        //   [ 6 個半週期的前導閃爍 SYNC_PATTERN，對應韌體「快速閃爍3次」 ]
        //   + [ 24-bit 資料，對應韌體 3 bytes 短碼（MSB-first）]
        // 韌體端前導脈衝與資料位元已統一使用 HASH_BIT_DURATION_MS(100ms) 同一個時脈，
        // 前導0.6秒 + 資料2.4秒 = 3.0秒整。網頁端用「滑動視窗」持續解出 bit，
        // 一旦視窗前段比對到同步碼，就把後面 24 bit 依 8-bit 一組還原成 HEX 字串比對。
        // =========================================================================
        const HASH_CONFIG = {
            BIT_DURATION_MS: 100,              // 對應韌體 HASH_BIT_DURATION_MS，須保持一致
            SYNC_PATTERN: [1, 0, 1, 0, 1, 0],  // 對應韌體「ON 40ms→OFF 40ms 共3次」的節奏(6個半週期)
            PAYLOAD_BITS: 24,                  // 3 bytes 短碼 = 24 bits
            EXPECTED_HASH: "3F1C4A",           // 對應韌體 HASH_CODE_BYTES {0x3F,0x1C,0x4A}
            LISTEN_TIMEOUT_MS: 15000,          // 監聽逾時：前導(0.6s)+資料(2.4s)=3s，留餘裕給使用者觸發手勢
            THRESHOLD_MARGIN: 20                // 局部區域取樣訊噪比佳，但遠距離時LED本身較暗，適度調低門檻增加靈敏度
        };
        const HASH_TOTAL_BITS = HASH_CONFIG.SYNC_PATTERN.length + HASH_CONFIG.PAYLOAD_BITS;

        let isHashListening = false;
        let hashListenStartTime = 0;
        let hashBaseline = null;           // 動態基準亮度（跟隨環境光緩慢調整）
        const BASELINE_ALPHA = 0.02;

        let currentBitSamples = [];        // 目前這個 bit 週期內收集到的原始樣本
        let currentBitStartTime = 0;
        let decodedBitStream = [];         // 已解出的 bit（滑動視窗，長度上限 HASH_TOTAL_BITS）

        // 每一幀呼叫一次：只有在 isHashListening 時才會實際處理
        function handleHashSample(signal, now) {
            if (!isHashListening) return;

            // 動態基準線：緩慢跟隨環境光平均亮度，避免長時間監聽時因環境光變化誤判
            if (hashBaseline === null) hashBaseline = signal;
            hashBaseline = hashBaseline * (1 - BASELINE_ALPHA) + signal * BASELINE_ALPHA;

            const bitLevel =
                signal > hashBaseline + HASH_CONFIG.THRESHOLD_MARGIN ? 1 :
                signal < hashBaseline - HASH_CONFIG.THRESHOLD_MARGIN ? 0 :
                null; // 落在基準線附近視為雜訊，不採計

            if (currentBitStartTime === 0) currentBitStartTime = now;
            if (bitLevel !== null) currentBitSamples.push(bitLevel);

            // [修正] 原本用 if 判斷、每次都把 currentBitStartTime 重設為 now，
            // 長時間監聽下容易累積時間漂移。改用 while + 固定步進累加，
            // 就算某幾幀處理較慢，bit 邊界時間點也不會跟著漂掉。
            while (now - currentBitStartTime >= HASH_CONFIG.BIT_DURATION_MS) {
                if (currentBitSamples.length > 0) {
                    const ones = currentBitSamples.filter(b => b === 1).length;
                    const bit = ones >= currentBitSamples.length / 2 ? 1 : 0;
                    pushDecodedBit(bit);
                }
                currentBitSamples = [];
                currentBitStartTime += HASH_CONFIG.BIT_DURATION_MS;
            }

            // 監聽逾時
            if (now - hashListenStartTime > HASH_CONFIG.LISTEN_TIMEOUT_MS) {
                stopHashListening('timeout');
            }
        }

        function pushDecodedBit(bit) {
            decodedBitStream.push(bit);
            if (decodedBitStream.length > HASH_TOTAL_BITS) decodedBitStream.shift();
            if (decodedBitStream.length === HASH_TOTAL_BITS) {
                tryMatchHash();
            }
        }

        function tryMatchHash() {
            const syncLen = HASH_CONFIG.SYNC_PATTERN.length;
            const candidateSync = decodedBitStream.slice(0, syncLen);
            const isSyncMatch = candidateSync.every((b, i) => b === HASH_CONFIG.SYNC_PATTERN[i]);

            if (!isSyncMatch) return; // 同步碼沒對齊，繼續等下一個 bit 滑進視窗

            const payloadBits = decodedBitStream.slice(syncLen);
            const decodedHash = bitsToHex(payloadBits);

            if (decodedHash === HASH_CONFIG.EXPECTED_HASH) {
                onHashMatchSuccess(decodedHash);
            } else {
                hashStatusEl.innerText = `狀態：HASH 不符 ❌ (收到 ${decodedHash})`;
            }
            // 不論成功與否都清空緩衝，避免同一段訊號重複觸發判定
            decodedBitStream = [];
        }

        // 8-bit 一組還原成 2 碼 HEX（對應韌體 MSB-first 的 byte 陣列短碼）
        function bitsToHex(bits) {
            let hex = '';
            for (let i = 0; i < bits.length; i += 8) {
                const byteBits = bits.slice(i, i + 8);
                const value = byteBits.reduce((acc, b) => (acc << 1) | b, 0);
                hex += value.toString(16).toUpperCase().padStart(2, '0');
            }
            return hex;
        }

        function onHashMatchSuccess(decodedHash) {
            hashStatusEl.innerText = `狀態：比對成功 ✅ (HASH=${decodedHash})`;
            triggerRedBreathing(); // 沿用原本效果：打勾項目2、紅色呼吸燈 5 秒後自動復原
            stopHashListening('success');
        }

        function toggleHashDetection() {
            if (isHashListening) {
                stopHashListening('manual');
            } else {
                startHashListening();
            }
        }

        function startHashListening() {
            isHashListening = true;
            hashListenStartTime = Date.now();
            hashBaseline = null;
            currentBitSamples = [];
            currentBitStartTime = 0;
            decodedBitStream = [];

            hashBtn.innerText = '⏹ 停止 HASH 偵測';
            hashBtn.classList.add('active');
            hashStatusEl.innerText = '狀態：監聽中...';
        }

        function stopHashListening(reason) {
            isHashListening = false;
            hashBtn.innerText = '🔓 啟動 HASH 比對';
            hashBtn.classList.remove('active');

            if (reason === 'timeout') {
                hashStatusEl.innerText = '狀態：監聽逾時 ❌，請重新嘗試';
            } else if (reason === 'manual') {
                hashStatusEl.innerText = '狀態：已手動停止';
            }
            // reason === 'success' 的文字已在 onHashMatchSuccess 設定，這裡不覆蓋
        }

        // =========================================================================
        // E. 麥克風開關控制 (項目 3 與 項目 4)
        // =========================================================================
        let isVoicListenerActive = false;
        let voicDisableTimer = null;
        const VOIC_LISTEN_DURATION = 8000; // 8 秒自動關閉

        function enableVoiceListener() {
            if (isVoicListenerActive) {
                resetVoiceDisableTimer();
                return;
            }

            isVoicListenerActive = true;

            // 更新除錯 Checklist：項目 3 打勾，項目 4 取消勾選
            setCheckStatus(chkMicOn, true);
            setCheckStatus(chkMicOff, false);

            if (recognition) {
                try { recognition.start(); } catch(e) {}
            }

            resetVoiceDisableTimer();
        }

        function disableVoiceListener() {
            if (!isVoicListenerActive) return;

            isVoicListenerActive = false;

            // 更新除錯 Checklist：項目 3 取消勾選，項目 4 打勾
            setCheckStatus(chkMicOn, false);
            setCheckStatus(chkMicOff, true);
            setCheckStatus(chkOptical, false); // 關閉麥克風時順便復原光學觸發狀態

            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }

            analysisOverlay.innerText = "Optical: IDLE";
            analysisOverlay.style.color = "#fff";
        }

        function resetVoiceDisableTimer() {
            clearTimeout(voicDisableTimer);
            voicDisableTimer = setTimeout(disableVoiceListener, VOIC_LISTEN_DURATION);
        }

        // =========================================================================
        // F. 跨口音語音魔法與 Web Speech API
        // =========================================================================
        let totemAnimation = null;
        function triggerAsclepiusEffect() {
            shield.classList.add('shield-active');
            startTotemAnimation();
            resetVoiceDisableTimer();

            setTimeout(() => { shield.classList.remove('shield-active'); }, 5000);
        }

        function startTotemAnimation() {
            let startY = canvas.height + 150;
            let targetY = canvas.height / 2;
            let currentY = startY;
            let state = 'ENTER';
            let holdStartTime = 0;

            function drawStaff(x, y, alpha) {
                ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha;
                ctx.strokeStyle = '#81D8D0'; ctx.fillStyle = '#81D8D0';
                ctx.shadowColor = '#81D8D0'; ctx.shadowBlur = 25; ctx.lineWidth = 8;
                ctx.beginPath(); ctx.moveTo(0, -100); ctx.lineTo(0, 100); ctx.stroke();
                ctx.beginPath(); ctx.arc(0, -100, 12, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath();
                for (let t = -90; t <= 90; t += 5) {
                    let curveX = Math.sin(t * 0.08) * 35;
                    if (t === -90) ctx.moveTo(curveX, t); else ctx.lineTo(curveX, t);
                }
                ctx.stroke(); ctx.restore();
            }

            function animate(timestamp) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (state === 'ENTER') {
                    currentY += (targetY - currentY) * 0.12;
                    if (Math.abs(currentY - targetY) < 3) { currentY = targetY; state = 'HOLD'; holdStartTime = timestamp; }
                } else if (state === 'HOLD') {
                    if (timestamp - holdStartTime > 500) { state = 'EXIT'; }
                } else if (state === 'EXIT') {
                    currentY -= 35; if (currentY < -150) state = 'DONE';
                }
                if (state !== 'DONE') { drawStaff(canvas.width / 2, currentY, 0.75); totemAnimation = requestAnimationFrame(animate); }
            }
            if (totemAnimation) cancelAnimationFrame(totemAnimation);
            totemAnimation = requestAnimationFrame(animate);
        }

        // 模糊比對
        function calculateLevenshteinDistance(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0) );
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min( matrix[i - 1][j] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j - 1] + cost );
                }
            }
            return matrix[a.length][b.length];
        }
        function getSimilarity(str1, str2) {
            const distance = calculateLevenshteinDistance(str1, str2);
            const maxLength = Math.max(str1.length, str2.length);
            if (maxLength === 0) return 1.0; return (1.0 - distance / maxLength);
        }

        const SPELL_DATABASE = {
            "asclepius": {
                aliases: [
                    "asclepius", "asclepios", "asklepios", "esclepius", "esculapius",
                    "aesculapius", "ask lepius", "asklepius", "ascalepius", "asclepious",
                    "asclipius", "aclepius", "a sclepius", "az clepius", "ass clepius",
                    "us clepius", "escalpius", "as clepius", "ash clepius"
                ],
                action: triggerAsclepiusEffect
            }
        };

        let spellCooldownUntil = 0; // 觸發後短暫冷卻，避免同一句話被重複判定好幾次

        function evaluateSpellVoice(spokenText) {
            if (Date.now() < spellCooldownUntil) return false;

            // 去標點符號，只留英文字母與空白
            const cleanInput = spokenText.trim().toLowerCase().replace(/[^a-z\s]/g, '');
            if (!cleanInput) return false;

            const words = cleanInput.split(/\s+/).filter(Boolean);

            // 候選字串：逐字比對 + 相鄰兩字黏起來比對（抵銷辨識引擎斷詞位置不準的問題）
            // + 整句去空格比對（涵蓋辨識剛好完整對上一個詞的情況）
            const candidates = [...words];
            for (let i = 0; i < words.length - 1; i++) {
                candidates.push(words[i] + words[i + 1]);
            }
            candidates.push(words.join(''));

            const SIMILARITY_THRESHOLD = 0.6;

            for (const [spellName, config] of Object.entries(SPELL_DATABASE)) {
                const allTargets = [spellName, ...config.aliases].map(t => t.replace(/\s+/g, ''));
                for (const candidate of candidates) {
                    for (const target of allTargets) {
                        if (getSimilarity(candidate, target) >= SIMILARITY_THRESHOLD) {
                            spellCooldownUntil = Date.now() + 4000;
                            config.action();
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // Web Speech API
        let recognition = null;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true; // [修正] 開啟即時中間結果，邊聽邊比對，增加咒語比對成功的機會
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript;
                speechLog.innerText = transcript;
                evaluateSpellVoice(transcript);
            };

            recognition.onerror = (e) => { if (e.error !== 'no-speech') console.log('Speech Error:', e.error); };
            recognition.onend = () => {
                // [修正] 這裡原本沒有 try/catch，若與其他 start() 呼叫時序撞在一起
                // 會拋出 InvalidStateError，導致語音辨識整個停擺。
                if (isVoicListenerActive) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        } else {
            console.warn('此瀏覽器不支援 webkitSpeechRecognition（建議使用 Chrome）。');
        }

        // [新增] 頁面卸載時釋放 OpenCV Mat，避免 WASM 記憶體洩漏
        window.addEventListener('beforeunload', () => {
            if (srcMat) srcMat.delete();
            if (grayMat) grayMat.delete();
        });
    </script>
</body>
</html>
