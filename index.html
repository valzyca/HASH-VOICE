<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST HASH+VOICE</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 呼吸紅燈效果 (HASH 閃爍解調成功時) */
        @keyframes breathingRed {
            0% { background-color: rgba(255, 0, 0, 0.15); }
            50% { background-color: rgba(255, 0, 0, 0.85); }
            100% { background-color: rgba(255, 0, 0, 0.15); }
        }
        .breathing-red {
            animation: breathingRed 1.5s infinite ease-in-out;
        }

        /* 蒂芬妮綠護盾樣式 (#81D8D0) */
        #shield-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-sizing: border-box;
            border: 24px solid #81D8D0;
            box-shadow: inset 0 0 60px #81D8D0, 0 0 40px #81D8D0;
            pointer-events: none; opacity: 0; 
            transition: opacity 0.4s ease-in-out;
            z-index: 5;
        }
        .shield-active { opacity: 1 !important; }

        /* Canvas 圖騰動畫繪製層 */
        canvas {
            position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none;
        }

        /* Webcam 即時預覽畫面 (右下角) */
        #video-preview {
            position: absolute; width: 220px; height: 165px;
            bottom: 15px; right: 15px; border: 2px solid #81D8D0;
            border-radius: 8px; transform: scaleX(-1); z-index: 20;
            box-shadow: 0 0 15px rgba(129, 216, 208, 0.5);
        }
        
        /* UI 狀態控制顯示介面 */
        #ui-info {
            position: absolute; top: 20px; left: 20px; color: #fff; z-index: 20;
            background: rgba(0, 0, 0, 0.6); padding: 15px 20px; border-radius: 10px;
            backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #ui-info h1 { margin: 0 0 10px 0; font-size: 22px; color: #81D8D0; }
        #ui-info p { margin: 5px 0; font-size: 14px; }
        .log-box { font-size: 12px; color: #aaa; margin-top: 5px; font-family: monospace; }
        
        .btn-test {
            margin-top: 10px; padding: 8px 12px; background: #81D8D0;
            border: none; border-radius: 5px; color: #111; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        .btn-test:hover { background: #65b8b0; }
    </style>
</head>
<body>

    <div id="shield-layer"></div>
    <canvas id="stageCanvas"></canvas>
    <video id="video-preview" autoplay playsinline></video>

    <div id="ui-info">
        <h1>專案：TEST HASH+VOICE</h1>
        <p>系統狀態：<span id="status" style="color: #81D8D0;">語音/光照監聽中...</span></p>
        <p class="log-box">最新辨識語音: <span id="speech-log" style="color: #fff;">無</span></p>
        <button class="btn-test" onclick="simulateHashDetect()">[測試] 模擬光通訊 HASH 脈衝觸發</button>
    </div>

    <script>
        // =========================================================================
        // 1. 畫布與全螢幕視覺效果 (WebAR/Canvas Engine)
        // =========================================================================
        const canvas = document.getElementById('stageCanvas');
        const ctx = canvas.getContext('2d');
        const shield = document.getElementById('shield-layer');
        const statusText = document.getElementById('status');
        const speechLog = document.getElementById('speech-log');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- A. 光通訊觸發：呼吸紅燈 (5秒後自動復原) ---
        function triggerRedBreathing() {
            statusText.innerText = "光通訊 16碼 HASH 驗證成功！進入呼吸紅色模式";
            document.body.classList.add('breathing-red');
            
            setTimeout(() => {
                document.body.classList.remove('breathing-red');
                statusText.innerText = "系統復原，繼續監聽中...";
            }, 5000);
        }

        function simulateHashDetect() {
            triggerRedBreathing();
        }

        // --- B. 語音魔法觸發：蒂芬妮綠護盾與半透明發光 Asclepius 圖騰飛入 ---
        let totemAnimation = null;

        function triggerAsclepiusEffect() {
            statusText.innerText = "咒語觸發：asclepius！護盾啟動";
            shield.classList.add('shield-active');

            // 啟動圖騰動畫
            startTotemAnimation();

            // 5秒後復原
            setTimeout(() => {
                shield.classList.remove('shield-active');
                statusText.innerText = "系統復原，繼續監聽中...";
            }, 5000);
        }

        // 半透明發光 Asclepius 蛇杖圖騰繪製動畫
        function startTotemAnimation() {
            let startY = canvas.height + 150;
            let targetY = canvas.height / 2;
            let currentY = startY;
            let state = 'ENTER'; // ENTER (飛入), HOLD (停留), EXIT (飛離), DONE
            let holdStartTime = 0;

            function drawStaff(x, y, alpha) {
                ctx.save();
                ctx.translate(x, y);
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = '#81D8D0';
                ctx.fillStyle = '#81D8D0';
                ctx.shadowColor = '#81D8D0';
                ctx.shadowBlur = 25;
                ctx.lineWidth = 8;

                // 繪製中央發光杖身
                ctx.beginPath();
                ctx.moveTo(0, -100); ctx.lineTo(0, 100);
                ctx.stroke();

                // 繪製頂端光點
                ctx.beginPath();
                ctx.arc(0, -100, 12, 0, Math.PI * 2);
                ctx.fill();

                // 繪製纏繞蛇身 (Serpent Vector Curve)
                ctx.beginPath();
                for (let t = -90; t <= 90; t += 5) {
                    let curveX = Math.sin(t * 0.08) * 35;
                    if (t === -90) ctx.moveTo(curveX, t);
                    else ctx.lineTo(curveX, t);
                }
                ctx.stroke();
                ctx.restore();
            }

            function animate(timestamp) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (state === 'ENTER') {
                    currentY += (targetY - currentY) * 0.12; // 飛入緩動
                    if (Math.abs(currentY - targetY) < 3) {
                        currentY = targetY;
                        state = 'HOLD';
                        holdStartTime = timestamp;
                    }
                } else if (state === 'HOLD') {
                    if (timestamp - holdStartTime > 500) { // 停留 0.5 秒
                        state = 'EXIT';
                    }
                } else if (state === 'EXIT') {
                    currentY -= 35; // 向上快速飛離
                    if (currentY < -150) state = 'DONE';
                }

                if (state !== 'DONE') {
                    drawStaff(canvas.width / 2, currentY, 0.75); // 0.75 半透明發光
                    totemAnimation = requestAnimationFrame(animate);
                }
            }

            if (totemAnimation) cancelAnimationFrame(totemAnimation);
            totemAnimation = requestAnimationFrame(animate);
        }


        // =========================================================================
        // 2. 跨口音語音魔法辨識架構與模糊演算法 (Fuzzy Matching Engine)
        // =========================================================================

        // 編輯距離演算法 (Levenshtein Distance Calculation)
        function calculateLevenshteinDistance(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, () => 
                Array(b.length + 1).fill(0)
            );

            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,       // 刪除
                        matrix[i][j - 1] + 1,       // 插入
                        matrix[i - 1][j - 1] + cost // 替換
                    );
                }
            }
            return matrix[a.length][b.length];
        }

        // 字串相似度比例計算器 (0.0 ~ 1.0)
        function getSimilarity(str1, str2) {
            const distance = calculateLevenshteinDistance(str1, str2);
            const maxLength = Math.max(str1.length, str2.length);
            if (maxLength === 0) return 1.0;
            return (1.0 - distance / maxLength);
        }

        // 魔法語音庫與跨口音變體資料庫 (Phonetic Variant DB)
        const SPELL_DATABASE = {
            "asclepius": {
                aliases: [
                    "asclepius", "asclepios", "esclepius", "ask lepius", 
                    "ass clepius", "ask lepios", "ask lepias", "usclepius",
                    "asclepiose", "asclepes", "asklepios"
                ],
                action: triggerAsclepiusEffect
            }
        };

        // 模糊比對評估核心函式
        function evaluateSpellVoice(spokenText) {
            const cleanInput = spokenText.trim().toLowerCase();
            const SIMILARITY_THRESHOLD = 0.65; // 65% 相似度即判定魔法觸發成功

            for (const [spellName, config] of Object.entries(SPELL_DATABASE)) {
                // A. 直比主詞 Similarity
                const mainScore = getSimilarity(cleanInput, spellName);
                if (mainScore >= SIMILARITY_THRESHOLD) {
                    console.log(`[魔法成功] 主詞通過, 相似度: ${(mainScore * 100).toFixed(1)}%`);
                    config.action();
                    return true;
                }

                // B. 口音變體庫 Alias 比對
                for (const alias of config.aliases) {
                    if (cleanInput.includes(alias) || getSimilarity(cleanInput, alias) >= SIMILARITY_THRESHOLD) {
                        console.log(`[魔法成功] 變體庫通過: "${alias}"`);
                        config.action();
                        return true;
                    }
                }
            }
            return false;
        }

        // =========================================================================
        // 3. Web Speech API 語音監聽初始化
        // =========================================================================
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if ('SpeechRecognition' in window) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US'; // 基礎設為英文，模糊演算法會自動處理口音偏誤

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript;
                speechLog.innerText = transcript;
                
                // 傳入跨口音模糊比對引擎
                evaluateSpellVoice(transcript);
            };

            recognition.onerror = (e) => console.log('語音辨識提示/錯誤:', e.error);
            recognition.onend = () => recognition.start(); // 保持持續監聽
            
            recognition.start();
        } else {
            alert("您的瀏覽器不支援 Web Speech API，請改用 Chrome 開啟。");
        }

        // 開啟鏡頭預覽 (預留給視覺解調光訊號使用)
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { document.getElementById('video-preview').srcObject = stream; })
            .catch(err => { console.log("無法取得攝影機權限:", err); });
    </script>
</body>
</html>
