<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST HASH+VOICE - Debug Checklist (Fixed)</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 呼吸紅燈效果 (HASH 驗證成功時) */
        @keyframes breathingRed {
            0% { background-color: rgba(255, 0, 0, 0.15); }
            50% { background-color: rgba(255, 0, 0, 0.9); }
            100% { background-color: rgba(255, 0, 0, 0.15); }
        }
        .breathing-red {
            animation: breathingRed 1.5s infinite ease-in-out;
        }

        /* 蒂芬妮綠護盾樣式 */
        #shield-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-sizing: border-box; border: 30px solid #81D8D0;
            box-shadow: inset 0 0 70px #81D8D0, 0 0 50px #81D8D0;
            pointer-events: none; opacity: 0;
            transition: opacity 0.4s ease-in-out; z-index: 5;
        }
        .shield-active { opacity: 1 !important; }

        /* Canvas 圖騰繪製層 */
        #stageCanvas {
            position: absolute; top: 0; left: 0; z-index: 10; pointer-events: none;
        }

        /* Webcam 視訊預覽 (右下角) */
        .video-container {
            position: absolute; width: 240px; height: 180px;
            bottom: 20px; right: 20px; border-radius: 12px; z-index: 20;
            box-shadow: 0 0 20px rgba(129, 216, 208, 0.6); overflow: hidden;
            border: 2px solid #333;
        }
        #video-preview {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
        }
        #analysis-overlay {
            position: absolute; top: 10px; left: 10px; color: #fff;
            background: rgba(0,0,0,0.75); padding: 4px 8px; border-radius: 4px;
            font-size: 11px; font-family: monospace; pointer-events: none;
        }

        /* UI 與除錯 Checklist 面板 (左上角) */
        #ui-info {
            position: absolute; top: 20px; left: 20px; color: #fff; z-index: 20;
            background: rgba(0, 0, 0, 0.75); padding: 20px 25px; border-radius: 12px;
            backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.15);
            min-width: 320px;
        }
        #ui-info h1 { margin: 0 0 10px 0; font-size: 22px; color: #81D8D0; }

        /* 除錯 Checklist 樣式 */
        .debug-panel {
            margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 12px;
        }
        .debug-title {
            font-size: 13px; color: #aaa; margin-bottom: 8px; font-weight: bold;
            letter-spacing: 1px;
        }
        .checklist-item {
            font-size: 14px; margin: 8px 0; color: #777;
            display: flex; align-items: center; transition: color 0.3s;
        }
        .checklist-item .icon {
            display: inline-block; width: 20px; font-size: 16px; margin-right: 8px;
            text-align: center;
        }
        /* 打勾與啟用狀態 */
        .checklist-item.checked {
            color: #81D8D0; font-weight: bold;
            text-shadow: 0 0 8px rgba(129, 216, 208, 0.4);
        }

        .log-box {
            font-size: 12px; color: #aaa; margin-top: 12px; font-family: monospace;
            background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px;
        }
        #cv-status {
            position: absolute; bottom: 10px; left: 10px; color: #777; font-size: 12px; z-index: 10;
        }

        .btn-sim {
            margin-top: 10px; padding: 6px 10px; background: #333; color: #81D8D0;
            border: 1px solid #81D8D0; border-radius: 4px; cursor: pointer; font-size: 11px;
        }
        .btn-sim:hover { background: #81D8D0; color: #111; }
    </style>
</head>
<body>

    <div id="shield-layer"></div>
    <canvas id="stageCanvas"></canvas>

    <div class="video-container">
        <video id="video-preview" autoplay playsinline muted></video>
        <div id="analysis-overlay">Optical: IDLE</div>
    </div>

    <!-- 主面板與除錯 Checklist -->
    <div id="ui-info">
        <h1>TEST HASH+VOICE</h1>
        <p style="margin: 0; font-size: 13px; color: #ccc;">系統狀態監視面板</p>

        <div class="debug-panel">
            <div class="debug-title">🔍 除錯即時狀態條 (DEBUG CHECKLIST)</div>

            <div id="chk-optical" class="checklist-item">
                <span class="icon">⬜</span> 1. 光學喚醒 (偵測到 2Hz 閃爍)
            </div>

            <div id="chk-hash" class="checklist-item">
                <span class="icon">⬜</span> 2. HASH 碼比對成功
            </div>

            <div id="chk-mic-on" class="checklist-item">
                <span class="icon">⬜</span> 3. 麥克風開啟
            </div>

            <!-- 進入網頁時預設即是打勾狀態 -->
            <div id="chk-mic-off" class="checklist-item checked">
                <span class="icon">✅</span> 4. 麥克風關閉
            </div>
        </div>

        <div class="log-box">
            最後辨識語音: <span id="speech-log" style="color: #fff;">(無)</span>
        </div>

        <!-- 模擬測試按鈕 (方便離線除錯) -->
        <button class="btn-sim" onclick="simulateHashDetect()">[測試] 模擬接收 HASH 光訊號</button>
    </div>

    <div id="cv-status">OpenCV.js loading...</div>

    <!-- 載入 OpenCV.js -->
    <script async src="https://docs.opencv.org/4.5.4/opencv.js" onload="onOpenCvReady();"></script>

    <script>
        // =========================================================================
        // A. 除錯顯示 UI 控制 logic
        // =========================================================================
        const chkOptical = document.getElementById('chk-optical');
        const chkHash    = document.getElementById('chk-hash');
        const chkMicOn   = document.getElementById('chk-mic-on');
        const chkMicOff  = document.getElementById('chk-mic-off');

        function setCheckStatus(element, isChecked) {
            const icon = element.querySelector('.icon');
            if (isChecked) {
                element.classList.add('checked');
                icon.innerText = '✅';
            } else {
                element.classList.remove('checked');
                icon.innerText = '⬜';
            }
        }

        // =========================================================================
        // B. 基礎介面
        // =========================================================================
        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('stageCanvas');
        const ctx = canvas.getContext('2d');
        const shield = document.getElementById('shield-layer');
        const speechLog = document.getElementById('speech-log');
        const cvStatusTxt = document.getElementById('cv-status');
        const analysisOverlay = document.getElementById('analysis-overlay');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // [修正] OpenCV 就緒與 Video 就緒是兩條獨立的非同步流程，
        // 必須「兩者都完成」才能安全啟動分析，否則 Mat 尺寸會是 0x0。
        let isOpenCvReady = false;
        let isVideoReady = false;

        function onOpenCvReady() {
            cvStatusTxt.innerText = "OpenCV.js Ready.";
            cvStatusTxt.style.color = "#81D8D0";
            isOpenCvReady = true;
            tryStartAnalysis();
        }

        function tryStartAnalysis() {
            if (isOpenCvReady && isVideoReady && !videoCapture) {
                startOpticalAnalysis();
            }
        }

        // =========================================================================
        // C. 光學喚醒 (2Hz) 與 HASH 光通訊解調
        // =========================================================================
        const ANALYSIS_FPS = 15;
        let videoCapture = null;
        let srcMat = null, grayMat = null;
        const brightnessHistory = [];
        const HISTORY_SIZE = ANALYSIS_FPS * 2;

        navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, frameRate: 30 } })
            .then(stream => {
                video.srcObject = stream;
                // [修正] 等 metadata 載入後才拿得到真正的 videoWidth/videoHeight，
                // 並把它們寫回 video.width / video.height（IDL 屬性），
                // 這樣 cv.VideoCapture 和 cv.Mat 才會用正確的尺寸建立。
                video.onloadedmetadata = () => {
                    video.width = video.videoWidth || 320;
                    video.height = video.videoHeight || 240;
                    isVideoReady = true;
                    tryStartAnalysis();
                };
            })
            .catch(err => {
                console.error("Webcam存取失敗:", err);
                cvStatusTxt.innerText = "攝影機存取失敗（請確認權限 / HTTPS）";
                cvStatusTxt.style.color = "#f55";
            });

        function startOpticalAnalysis() {
            videoCapture = new cv.VideoCapture(video);
            srcMat = new cv.Mat(video.height, video.width, cv.CV_8UC4);
            grayMat = new cv.Mat(video.height, video.width, cv.CV_8UC1);

            setInterval(processVideoFrame, 1000 / ANALYSIS_FPS);
        }

        function processVideoFrame() {
            if (!isOpenCvReady || !isVideoReady || video.paused || video.ended) return;

            // [修正] 加上 try/catch，避免單一 frame 讀取失敗時
            // setInterval 每次都拋錯洗版 console、甚至中斷偵測。
            try {
                videoCapture.read(srcMat);
                cv.cvtColor(srcMat, grayMat, cv.COLOR_RGBA2GRAY);

                let mean = cv.mean(grayMat);
                brightnessHistory.push({ t: Date.now(), v: mean[0] });
                if (brightnessHistory.length > HISTORY_SIZE) brightnessHistory.shift();

                // 1. 檢測 2Hz 閃爍 (光學喚醒)
                if (detect2HzFlicker()) {
                    handleOpticalTrigger();
                } else {
                    // 如果未偵測到，取消 2Hz 打勾 (除非麥克風開啟中)
                    if (!isVoicListenerActive) {
                        setCheckStatus(chkOptical, false);
                    }
                }
            } catch (e) {
                console.error("Frame 分析失敗:", e);
            }
        }

        function detect2HzFlicker() {
            if (brightnessHistory.length < HISTORY_SIZE) return false;
            let crossings = 0;
            const sum = brightnessHistory.reduce((a, b) => a + b.v, 0);
            const avg = sum / brightnessHistory.length;

            for (let i = 1; i < brightnessHistory.length; i++) {
                if ((brightnessHistory[i-1].v < avg && brightnessHistory[i].v >= avg) ||
                    (brightnessHistory[i-1].v > avg && brightnessHistory[i].v <= avg)) {
                    crossings++;
                }
            }

            if (crossings >= 6 && crossings <= 10) {
                const maxB = Math.max(...brightnessHistory.map(h => h.v));
                const minB = Math.min(...brightnessHistory.map(h => h.v));
                if (maxB - minB > 30) return true;
            }
            return false;
        }

        // 當光學喚醒成功 (偵測到 2Hz 閃爍)
        function handleOpticalTrigger() {
            analysisOverlay.innerText = "Optical: DETECTED 2Hz";
            analysisOverlay.style.color = "#ff0";

            // 項目 1 打勾：光學喚醒 2Hz
            setCheckStatus(chkOptical, true);

            // 光學觸發後，啟用麥克風監聽
            enableVoiceListener();
        }

        // =========================================================================
        // D. HASH 比對與呼吸燈觸發
        // =========================================================================
        function triggerRedBreathing() {
            // 項目 2 打勾：比對 HASH
            setCheckStatus(chkHash, true);

            document.body.classList.add('breathing-red');

            setTimeout(() => {
                document.body.classList.remove('breathing-red');
                setCheckStatus(chkHash, false); // 復原後取消打勾
            }, 5000);
        }

        function simulateHashDetect() {
            triggerRedBreathing();
        }

        // =========================================================================
        // E. 麥克風開關控制 (項目 3 與 項目 4)
        // =========================================================================
        let isVoicListenerActive = false;
        let voicDisableTimer = null;
        const VOIC_LISTEN_DURATION = 8000; // 8 秒自動關閉

        function enableVoiceListener() {
            if (isVoicListenerActive) {
                resetVoiceDisableTimer();
                return;
            }

            isVoicListenerActive = true;

            // 更新除錯 Checklist：項目 3 打勾，項目 4 取消勾選
            setCheckStatus(chkMicOn, true);
            setCheckStatus(chkMicOff, false);

            if (recognition) {
                try { recognition.start(); } catch(e) {}
            }

            resetVoiceDisableTimer();
        }

        function disableVoiceListener() {
            if (!isVoicListenerActive) return;

            isVoicListenerActive = false;

            // 更新除錯 Checklist：項目 3 取消勾選，項目 4 打勾
            setCheckStatus(chkMicOn, false);
            setCheckStatus(chkMicOff, true);
            setCheckStatus(chkOptical, false); // 關閉麥克風時順便復原光學觸發狀態

            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }

            analysisOverlay.innerText = "Optical: IDLE";
            analysisOverlay.style.color = "#fff";
        }

        function resetVoiceDisableTimer() {
            clearTimeout(voicDisableTimer);
            voicDisableTimer = setTimeout(disableVoiceListener, VOIC_LISTEN_DURATION);
        }

        // =========================================================================
        // F. 跨口音語音魔法與 Web Speech API
        // =========================================================================
        let totemAnimation = null;
        function triggerAsclepiusEffect() {
            shield.classList.add('shield-active');
            startTotemAnimation();
            resetVoiceDisableTimer();

            setTimeout(() => { shield.classList.remove('shield-active'); }, 5000);
        }

        function startTotemAnimation() {
            let startY = canvas.height + 150;
            let targetY = canvas.height / 2;
            let currentY = startY;
            let state = 'ENTER';
            let holdStartTime = 0;

            function drawStaff(x, y, alpha) {
                ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha;
                ctx.strokeStyle = '#81D8D0'; ctx.fillStyle = '#81D8D0';
                ctx.shadowColor = '#81D8D0'; ctx.shadowBlur = 25; ctx.lineWidth = 8;
                ctx.beginPath(); ctx.moveTo(0, -100); ctx.lineTo(0, 100); ctx.stroke();
                ctx.beginPath(); ctx.arc(0, -100, 12, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath();
                for (let t = -90; t <= 90; t += 5) {
                    let curveX = Math.sin(t * 0.08) * 35;
                    if (t === -90) ctx.moveTo(curveX, t); else ctx.lineTo(curveX, t);
                }
                ctx.stroke(); ctx.restore();
            }

            function animate(timestamp) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (state === 'ENTER') {
                    currentY += (targetY - currentY) * 0.12;
                    if (Math.abs(currentY - targetY) < 3) { currentY = targetY; state = 'HOLD'; holdStartTime = timestamp; }
                } else if (state === 'HOLD') {
                    if (timestamp - holdStartTime > 500) { state = 'EXIT'; }
                } else if (state === 'EXIT') {
                    currentY -= 35; if (currentY < -150) state = 'DONE';
                }
                if (state !== 'DONE') { drawStaff(canvas.width / 2, currentY, 0.75); totemAnimation = requestAnimationFrame(animate); }
            }
            if (totemAnimation) cancelAnimationFrame(totemAnimation);
            totemAnimation = requestAnimationFrame(animate);
        }

        // 模糊比對
        function calculateLevenshteinDistance(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0) );
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min( matrix[i - 1][j] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j - 1] + cost );
                }
            }
            return matrix[a.length][b.length];
        }
        function getSimilarity(str1, str2) {
            const distance = calculateLevenshteinDistance(str1, str2);
            const maxLength = Math.max(str1.length, str2.length);
            if (maxLength === 0) return 1.0; return (1.0 - distance / maxLength);
        }

        const SPELL_DATABASE = {
            "asclepius": {
                aliases: ["asclepius", "asclepios", "esclepius", "ask lepius", "ass clepius", "usclepius", "asklepios"],
                action: triggerAsclepiusEffect
            }
        };

        function evaluateSpellVoice(spokenText) {
            const cleanInput = spokenText.trim().toLowerCase();
            const SIMILARITY_THRESHOLD = 0.65;
            for (const [spellName, config] of Object.entries(SPELL_DATABASE)) {
                const mainScore = getSimilarity(cleanInput, spellName);
                if (mainScore >= SIMILARITY_THRESHOLD) { config.action(); return true; }
                for (const alias of config.aliases) {
                    if (cleanInput.includes(alias) || getSimilarity(cleanInput, alias) >= SIMILARITY_THRESHOLD) {
                        config.action(); return true;
                    }
                }
            }
            return false;
        }

        // Web Speech API
        let recognition = null;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript;
                speechLog.innerText = transcript;
                evaluateSpellVoice(transcript);
            };

            recognition.onerror = (e) => { if (e.error !== 'no-speech') console.log('Speech Error:', e.error); };
            recognition.onend = () => {
                // [修正] 這裡原本沒有 try/catch，若與其他 start() 呼叫時序撞在一起
                // 會拋出 InvalidStateError，導致語音辨識整個停擺。
                if (isVoicListenerActive) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        } else {
            console.warn('此瀏覽器不支援 webkitSpeechRecognition（建議使用 Chrome）。');
        }

        // [新增] 頁面卸載時釋放 OpenCV Mat，避免 WASM 記憶體洩漏
        window.addEventListener('beforeunload', () => {
            if (srcMat) srcMat.delete();
            if (grayMat) grayMat.delete();
        });
    </script>
</body>
</html>
